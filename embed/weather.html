<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather - Embed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body>
    <div style="text-align: center; padding: 30px;">
    <div style="font-size: 3em; margin-bottom: 10px;">⛅</div>
    <p style="font-size: 1.5em; margin-bottom: 5px;">72°F</p>
    <p style="color: #666;">San Francisco, CA</p>
    <p style="margin-top: 20px; color: #888; font-size: 0.9em;">
        Note: Connect to a weather API for live data.
    </p>
</div>
</body>
</html>
