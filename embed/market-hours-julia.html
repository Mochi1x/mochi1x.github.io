
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex Market Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --card-bg: rgba(24, 24, 27, 0.35);
    --card-border: rgba(128,128,128,0.15);
    --text-main: inherit;
    --text-muted: inherit;
    --accent: #f59e0b;
    --closed-text: #f87171;
    --open-text: #4ade80;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: transparent !important;
    color: var(--text-main);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: auto;
    overflow-x: hidden;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 12px;
    background: transparent !important;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 20px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.15);
    background: transparent !important;
    border: none !important;
  }
  .badge.open { color: var(--open-text); }
  .badge.closed { color: var(--closed-text); }
  .dot { box-shadow: none !important; }

  .clocks {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 20px;
  }
  .clock { text-align: center; }
  .clock .label { font-size: 10px; text-transform: uppercase; opacity: 0.6; margin-bottom: 4px; }
  .clock .time {
    font-size: 28px;
    font-weight: 700;
    font-family: "JetBrains Mono", monospace;
    letter-spacing: -0.5px;
  }
  .clock.local .time { color: var(--accent); }
  .clock.utc .time { color: var(--text-main); }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 0;
  }

  .card {
    background: var(--card-bg) !important;
    border: 1px solid var(--card-border) !important;
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: none !important;
    display: block;
    text-decoration: none;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .card-name {
    font-size: 15px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-main) !important;
  }
  .card-times {
    font-size: 12px;
    white-space: nowrap;
    color: var(--text-muted) !important;
    opacity: 0.7;
  }

  @media (max-width: 360px) {
    .wrap { padding: 16px 12px; }
    .clocks { gap: 24px; }
    .clock .time { font-size: 24px; }
  }
  
</style>
</head>
<body>
<div class="wrap">
  <div id="badge" class="badge closed">
    <span class="dot"></span>
    <span class="text">Market Closed</span>
  </div>

  <div class="clocks">
    <div class="clock local">
      <div class="label">Your Time</div>
      <div class="time" id="local-time">--:--:-- --</div>
    </div>
    <div class="clock utc">
      <div class="label">UTC</div>
      <div class="time" id="utc-time">--:--:--</div>
    </div>
  </div>

  <div class="grid" id="grid">
    <!-- Populated by JS -->
  </div>
</div>

<script>
  (function() {
    // Session definitions in UTC hours (0-23)
    const sessions = [
      { id: 'sydney', name: 'Sydney', flag: '🇦🇺', start: 22, end: 7 },
      { id: 'tokyo',  name: 'Tokyo',  flag: '🇯🇵', start: 0,  end: 9 },
      { id: 'london', name: 'London', flag: '🇬🇧', start: 8,  end: 17 },
      { id: 'ny',     name: 'New York', flag: '🇺🇸', start: 13, end: 22 }
    ];

    function pad2(n) { return n.toString().padStart(2, '0'); }
    function format12h(h, m, s) {
      const ampm = h >= 12 ? 'PM' : 'AM';
      let h12 = h % 12;
      if (h12 === 0) h12 = 12;
      return `${pad2(h12)}:${pad2(m)}:${pad2(s)} ${ampm}`;
    }
    function format24h(h, m, s) {
      return `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
    }
    // Convert UTC hour to local hour string (12h) with minutes :00
    function localTimeRange(utcStart, utcEnd, tzOffset) {
      // tzOffset in hours: e.g. -5 for EST, +9 for JST
      const toLocal = (h) => (h + tzOffset + 24) % 24;
      const ls = toLocal(utcStart);
      const le = toLocal(utcEnd);
      const fmt = (h) => {
        const ampm = h >= 12 ? 'PM' : 'AM';
        const h12 = (h % 12) === 0 ? 12 : (h % 12);
        return `${h12}:00 ${ampm}`;
      };
      // Note: If session spans midnight, it's fine
      return `${fmt(ls)} — ${fmt(le)}`;
    }

    function buildGrid(tzOffset) {
      const grid = document.getElementById('grid');
      grid.innerHTML = sessions.map(s => {
        const times = localTimeRange(s.start, s.end, tzOffset);
        return `
          <div class="card">
            <div class="card-header">
              <span class="card-name">${s.flag} ${s.name}</span>
            </div>
            <div class="card-times">${times}</div>
          </div>
        `;
      }).join('');
    }

    function isSessionOpen(start, end, nowUtcHour) {
      if (start < end) {
        return nowUtcHour >= start && nowUtcHour < end;
      } else { // overnight
        return nowUtcHour >= start || nowUtcHour < end;
      }
    }

    function updateBadge(anyOpen) {
      const badge = document.getElementById('badge');
      const txt = badge.querySelector('.text');
      if (anyOpen) {
        badge.className = 'badge open';
        txt.textContent = 'Market Open';
      } else {
        badge.className = 'badge closed';
        txt.textContent = 'Market Closed';
      }
    }

    function updateClocks() {
      const now = new Date();
      const localH = now.getHours();
      const localM = now.getMinutes();
      const localS = now.getSeconds();
      const utcH = now.getUTCHours();
      const utcM = now.getUTCMinutes();
      const utcS = now.getUTCSeconds();

      document.getElementById('local-time').textContent = format12h(localH, localM, localS);
      document.getElementById('utc-time').textContent = format24h(utcH, utcM, utcS);
    }

    function updateStatus() {
      const now = new Date();
      const h = now.getUTCHours();
      const day = now.getUTCDay(); // 0=Sun, 6=Sat

      // Weekly schedule: open Mon 00:00 UTC – Fri 22:00 UTC
      // Closed all day Saturday (6)
      if (day === 6) {
        updateBadge(false);
        return;
      }
      // Sunday: only open after Sydney opens at 22:00 UTC
      if (day === 0 && h < 22) {
        updateBadge(false);
        return;
      }
      // Friday: closes when NY session ends at 22:00 UTC
      if (day === 5 && h >= 22) {
        updateBadge(false);
        return;
      }

      // Regular hours: check if any session is currently open
      const anyOpen = sessions.some(s => isSessionOpen(s.start, s.end, h));
      updateBadge(anyOpen);
    }

    function tick() {
      updateClocks();
      updateStatus();
    }

    // Init
    const tzOffset = -new Date().getTimezoneOffset() / 60; // e.g., -5 for EST
    buildGrid(tzOffset);
    tick();
    setInterval(tick, 1000);
  })();
</script>
</body>
</html>
