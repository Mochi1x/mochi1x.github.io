<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chart - Embed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background: #0a0a0f !important;
            overflow: hidden;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        #tv_chart {
            width: 100% !important;
            height: 100% !important;
            background: #0a0a0f !important;
        }
        /* Remove TradingView attribution */
        .tradingview-widget-copyright,
        .tradingview-widget-footer,
        .tv-widget-footer,
        [class*='footer'] {
            display: none !important;
            visibility: hidden !important;
            height: 0 !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }
        /* Remove attribution links */
        .tradingview-widget-container a[href*='tradingview'] {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="tv_chart" class="tradingview-widget-container"></div>

    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async></script>

    <script type="text/javascript">
      new TradingView.widget({
        "width": 1280,
        "height": 720,
        "symbol": "NASDAQ:AAPL",
        "theme": "dark",
        "timezone": "Etc/UTC",
        "style": "1",
        "locale": "en",
        "interval": "D",
        "backgroundColor": "#0A0A0F",
        "gridColor": "rgba(242, 242, 242, 0.06)",
        "allow_symbol_change": true,
        "watchlist": [],
        "studies": [],
        "hide_side_toolbar": true,
        "hide_top_toolbar": false,
        "hide_legend": false,
        "hide_volume": false,
        "hotlist": false,
        "calendar": false,
        "details": false,
        "save_image": true,
        "withdateranges": false,
        "compareSymbols": []
      });
    </script>
</body>
</html>
