<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chart - Embed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background: #0a0a0f !important;
            overflow: hidden;
            width: 1280px;
            height: 720px;
            padding: 0;
            margin: 0;
            position: relative;
        }{
            background: #0a0a0f !important;
            overflow: hidden;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }}
        .tradingview-widget-container,
        .tradingview-widget-container__widget,
        tv-ticker-tape, tv-economic-map {{
            background: #0a0a0f !important;
            width: 100% !important;
            height: 100% !important;
        }}
        iframe {{
            background: #0a0a0f !important;
        }}
        /* Remove TradingView attribution */
        .tradingview-widget-container__footer,
        .tradingview-widget-footer,
        .tv-widget-footer,
        [class*='footer'] {{
            display: none !important;
            visibility: hidden !important;
            height: 0 !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }}
        /* Remove attribution links */
        .tradingview-widget-container a[href*='tradingview'] {{
            display: none !important;
        }}
    


    </style>
</head>
<body>
    <!-- TradingView Widget BEGIN -->
    <div class="tradingview-widget-container" style="height:720px;width:1280px">
      <div class="tradingview-widget-container__widget" style="height:calc(100% - 32px);width:100%"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
      {{
        "allow_symbol_change": true,
        "calendar": false,
        "details": false,
        "hide_side_toolbar": true,
        "hide_top_toolbar": false,
        "hide_legend": false,
        "hide_volume": false,
        "hotlist": false,
        "interval": "D",
        "locale": "en",
        "save_image": true,
        "style": "1",
        "symbol": "NASDAQ:AAPL",
        "theme": "dark",
        "timezone": "Etc/UTC",
        "backgroundColor": "#0A0A0F",
        "gridColor": "rgba(242, 242, 242, 0.06)",
        "watchlist": [],
        "withdateranges": false,
        "compareSymbols": [],
        "studies": [],
        "autosize": true
      }}
      </script>
    </div>
    <!-- TradingView Widget END -->
</body>
</html>
