<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticker Tape - Embed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background: #000000 !important;
            overflow: hidden;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        /* Hide TradingView attribution footer */
        .tradingview-widget-container__footer,
        .tradingview-widget-footer,
        .tv-widget-footer,
        [class*="footer"],
        .tradingview-widget-container a[href*="tradingview"] {
            display: none !important;
            visibility: hidden !important;
            height: 0 !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }

        /* Force dark on all TradingView containers */
        .tradingview-widget-container, 
        .tradingview-widget-container__widget,
        tv-ticker-tape {
            background: #000000 !important;
            width: 100% !important;
            height: 100% !important;
        }
        /* Hide any iframes that might have white bg */
        iframe {
            background: #000000 !important;
        }
    </style>
</head>
<body>
    <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-ticker-tape.js"></script>
    <tv-ticker-tape symbols="FOREXCOM:SPXUSD,FOREXCOM:NSXUSD,FOREXCOM:DJI,FX:EURUSD,BITSTAMP:BTCUSD,BITSTAMP:ETHUSD,CMCMARKETS:GOLD" theme="dark"></tv-ticker-tape>
</body>
</html>
