<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economic Map - Embed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background: #000000 !important;
            overflow: hidden;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        /* Force dark on all TradingView containers */
        .tradingview-widget-container,
        .tradingview-widget-container__widget,
        tv-economic-map {
            background: #000000 !important;
            width: 100% !important;
            height: 100% !important;
        }
        iframe {
            background: #000000 !important;
        }
    </style>
</head>
<body>
    <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-economic-map.js"></script>
    <tv-economic-map theme="dark"></tv-economic-map>
</body>
</html>
