<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economic Map - Embed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background: #000000 !important;
            overflow: hidden;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        /* Hide TradingView attribution footer */
        .tradingview-widget-container__footer,
        .tradingview-widget-footer,
        .tv-widget-footer,
        [class*="footer"],
        .tradingview-widget-container a[href*="world-bank"],
        .tradingview-widget-container a[href*="worldeconomics"] {
            display: none !important;
            visibility: hidden !important;
            height: 0 !important;
            min-height: 0 !important;
            margin: 0 !important;
            padding: 0 !important;
            overflow: hidden !important;
        }

        /* Ensure widget fills screen */
        tv-economic-map {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
    </style>
</head>
<body>
    <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-economic-map.js"></script>
    <tv-economic-map theme="dark"></tv-economic-map>
</body>
</html>
