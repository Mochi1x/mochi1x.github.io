<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Economic Map - Embed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        .widget-container {
            width: 100%;
            height: 100%;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }
        /* TradingView widgets - remove their default copyright margin/padding */
        .tradingview-widget-copyright {
            padding: 4px 0;
            text-align: center;
            font-size: 12px;
            color: #8b949e;
        }
        .tradingview-widget-copyright a {
            color: #0366d6;
            text-decoration: none;
        }
        /* Ensure iframe-based widgets fill container */
        tv-ticker-tape, tv-economic-map {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-economic-map.js"></script>
<tv-economic-map></tv-economic-map>
    </div>
</body>
</html>
