<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Music — 13th Reason (Proxy Embed v3)</title>
  <style>
    :root { --bg: #0a0a0f; --card-bg: rgba(24,24,27,0.6); --card-border: rgba(63,63,70,0.5); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg) !important; width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 12px; background: var(--bg) !important; }
    .card {
      background: var(--card-bg) !important;
      border: 1px solid var(--card-border) !important;
      border-radius: 16px; overflow: hidden;
      backdrop-filter: blur(12px) saturate(180%);
      box-shadow: 0 4px 24px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.05);
      min-height: 150px;
    }
    #widget-container { width: 100%; height: 100%; }
    #widget-container iframe { width: 100% !important; height: 100% !important; border: 0; }
    .error {
      display: flex; align-items: center; justify-content: center;
      height: 150px; color: #f87171; font-size: 14px; padding: 20px; text-align: center;
      background: rgba(248,113,113,0.05); border-radius: 12px; margin: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div id="widget-container">
        <div class="error">Loading Apple Music widget…</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const targetUrl = 'https://embed.music.apple.com/us/album/13th-reason/1873421961?i=1873421963';
      const container = document.getElementById('widget-container');

      const proxies = [
        'https://api.codetabs.com/v1/proxy?quest=',
        'https://api.allorigins.win/raw?url=',
        'https://thingproxy.freeboard.io/fetch/'
      ];

      function rewriteUrls(html) {
        return html.replace(/(src|href)=["'](\/[^"'>]+)["']/g, (m, attr, path) => {
          if (path.startsWith('//')) return m;
          return attr + '="https://embed.music.apple.com' + path + '"';
        });
      }

      function loadWithTimeout(url, ms = 6000) {
        return new Promise((resolve, reject) => {
          const ctrl = new AbortController();
          const timer = setTimeout(() => {
            ctrl.abort(); reject(new Error('Timeout'));
          }, ms);
          fetch(url, { signal: ctrl.signal })
            .then(r => {
              clearTimeout(timer);
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.text();
            })
            .then(resolve)
            .catch(e => {
              clearTimeout(timer); reject(e);
            });
        });
      }

      function tryProxy(i) {
        if (i >= proxies.length) {
          container.innerHTML = '<div class="error">❌ All proxies failed.</div>';
          return;
        }
        const url = proxies[i] + encodeURIComponent(targetUrl);
        console.log('Attempt', i+1, '→', proxies[i]);

        loadWithTimeout(url)
          .then(raw => {
            console.log('Fetched', raw.length, 'bytes');
            const html = rewriteUrls(raw);
            if (!html.includes('<embed-root')) throw new Error('Not Apple embed HTML');
            // Inject using srcdoc — keeps same-origin, no blob issues
            const iframe = document.createElement('iframe');
            iframe.sandbox = 'allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation';
            iframe.setAttribute('allow', 'autoplay *; encrypted-media *; fullscreen');
            iframe.srcdoc = html;
            container.innerHTML = '';
            container.appendChild(iframe);
            setTimeout(() => {
              const h = document.body.scrollHeight;
              window.parent.postMessage({type: 'setHeight', height: h}, '*');
            }, 2500);
          })
          .catch(err => {
            console.error('Proxy', i, 'failed:', err.message || err);
            tryProxy(i+1);
          });
      }

      tryProxy(0);
    })();
  </script>
</body>
</html>
