<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Music — 13th Reason (Proxy v2)</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: rgba(24, 24, 27, 0.6);
      --card-border: rgba(63, 63, 70, 0.5);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: var(--bg) !important;
      width: 100%; height: 100%;
      overflow: hidden; margin: 0; padding: 0;
    }
    .wrap {
      max-width: 720px; margin: 0 auto;
      padding: 12px; background: var(--bg) !important;
    }
    .card {
      background: var(--card-bg) !important;
      border: 1px solid var(--card-border) !important;
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(12px) saturate(180%);
      box-shadow: 0 4px 24px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.05);
      min-height: 150px;
    }
    #widget-container {
      width: 100%; height: 100%;
    }
    #widget-container iframe {
      width: 100% !important; height: 100% !important; border: 0;
    }
    .error {
      display: flex; align-items: center; justify-content: center;
      height: 150px; color: #f87171; font-size: 14px; padding: 20px; text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div id="widget-container">
        <div class="error">Loading Apple Music widget…</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const targetUrl = 'https://embed.music.apple.com/us/album/13th-reason/1873421961?i=1873421963';
      const container = document.getElementById('widget-container');

      // Try multiple CORS proxies in sequence
      const proxies = [
        'https://api.allorigins.win/raw?url=',
        'https://api.codetabs.com/v1/proxy?quest=',
        'https://thingproxy.freeboard.io/fetch/'
      ];

      function rewriteUrls(html) {
        // Convert relative asset paths to absolute
        return html.replace(
          /(src|href)==["'](\/[^"'>]+)["']/g,
          (m, attr, path) => {
            if (path.startsWith('//')) return m;  // protocol-relative, leave alone
            const abs = 'https://embed.music.apple.com' + path;
            return attr + '="' + abs + '"';
          }
        );
      }

      function tryProxy(idx) {
        if (idx >= proxies.length) {
          container.innerHTML = '<div class="error">❌ All proxies failed. Apple Music blocks embedding.</div>';
          return;
        }
        const proxyUrl = proxies[idx] + encodeURIComponent(targetUrl);
        console.log('Trying proxy:', proxies[idx]);

        fetch(proxyUrl, {mode: 'cors'})
          .then(r => {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
          })
          .then(rawHtml => {
            console.log('Fetched', rawHtml.length, 'bytes');
            // Rewrite relative URLs to absolute
            const fixedHtml = rewriteUrls(rawHtml);
            console.log('Rewritten HTML (first 300):', fixedHtml.substring(0,300));

            // Create a sanitized iframe that loads the rewritten HTML via blob
            const blob = new Blob([fixedHtml], {type: 'text/html'});
            const blobUrl = URL.createObjectURL(blob);
            const iframe = document.createElement('iframe');
            iframe.src = blobUrl;
            iframe.setAttribute('allow', 'autoplay *; encrypted-media *; fullscreen');
            iframe.setAttribute('sandbox', 'allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation');
            container.innerHTML = '';
            container.appendChild(iframe);

            // Notify parent window of height (for Notion auto-resize)
            setTimeout(() => {
              const h = document.body.scrollHeight;
              window.parent.postMessage({type: 'setHeight', height: h}, '*');
            }, 2000);
          })
          .catch(err => {
            console.error('Proxy failed:', err);
            tryProxy(idx + 1);
          });
      }

      tryProxy(0);
    })();
  </script>
</body>
</html>
