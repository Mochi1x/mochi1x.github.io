<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Music — 13th Reason (Proxy Embed)</title>
  <style>
    :root { --bg: #0a0a0f; --card-bg: rgba(24,24,27,0.6); --card-border: rgba(63,63,70,0.5); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: var(--bg) !important; width: 100%; height: 100%; overflow: hidden; margin: 0; padding: 0; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 12px; background: var(--bg) !important; }
    .card {
      background: var(--card-bg) !important;
      border: 1px solid var(--card-border) !important;
      border-radius: 16px; overflow: hidden;
      backdrop-filter: blur(12px) saturate(180%);
      box-shadow: 0 4px 24px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.05);
      min-height: 150px;
    }
    #widget-container { width: 100%; height: 100%; }
    #widget-container iframe { width: 100% !important; height: 100% !important; border: 0; }
    .error {
      display: flex; align-items: center; justify-content: center;
      height: 150px; color: #f87171; font-size: 14px; padding: 20px; text-align: center;
      background: rgba(248,113,113,0.05); border-radius: 12px; margin: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div id="widget-container">
        <div class="error">Loading Apple Music widget…</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const targetUrl = 'https://embed.music.apple.com/us/album/13th-reason/1873421961?i=1873421963';
      const container = document.getElementById('widget-container');

      // Prioritized list of working CORS proxies
      const proxies = [
        'https://api.codetabs.com/v1/proxy?quest=',
        'https://api.allorigins.win/raw?url=',
        'https://thingproxy.freeboard.io/fetch/'
      ];

      function rewriteUrls(html) {
        // Replace relative src/href to absolute on embed.music.apple.com
        return html.replace(/(src|href)=["'](\/[^"'>]+)["']/g, (m, attr, path) => {
          if (path.startsWith('//')) return m;
          const abs = 'https://embed.music.apple.com' + path;
          return attr + '="' + abs + '"';
        });
      }

      function loadWithTimeout(url, timeout = 6000) {
        return new Promise((resolve, reject) => {
          const controller = new AbortController();
          const timer = setTimeout(() => {
            controller.abort();
            reject(new Error('Timeout'));
          }, timeout);
          fetch(url, { signal: controller.signal, mode: 'cors' })
            .then(r => {
              clearTimeout(timer);
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.text();
            })
            .then(resolve)
            .catch(err => {
              clearTimeout(timer);
              reject(err);
            });
        });
      }

      function tryProxy(idx) {
        if (idx >= proxies.length) {
          container.innerHTML = '<div class="error">❌ All proxies failed. Apple Music blocks embedding.</div>';
          return;
        }
        const url = proxies[idx] + encodeURIComponent(targetUrl);
        console.log('Trying proxy #' + (idx+1) + ':', proxies[idx]);

        loadWithTimeout(url, 6000)
          .then(rawHtml => {
            console.log('Fetched', rawHtml.length, 'bytes from proxy');
            const fixedHtml = rewriteUrls(rawHtml);
            // Quick sanity check
            if (!fixedHtml.includes('<embed-root')) {
              console.warn('Response missing <embed-root>, trying next proxy');
              throw new Error('Invalid response');
            }
            // Inject via iframe blob to isolate CSS/JS
            const blob = new Blob([fixedHtml], {type: 'text/html'});
            const blobUrl = URL.createObjectURL(blob);
            const iframe = document.createElement('iframe');
            iframe.src = blobUrl;
            iframe.setAttribute('allow', 'autoplay *; encrypted-media *; fullscreen');
            iframe.setAttribute('sandbox', 'allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation');
            container.innerHTML = '';
            container.appendChild(iframe);
            // Auto-resize for Notion
            setTimeout(() => {
              const h = document.body.scrollHeight;
              window.parent.postMessage({type: 'setHeight', height: h}, '*');
            }, 2500);
          })
          .catch(err => {
            console.error('Proxy failed:', err.message || err);
            tryProxy(idx + 1);
          });
      }

      tryProxy(0);
    })();
  </script>
</body>
</html>
