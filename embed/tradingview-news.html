<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tradingview News - Embed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            background: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        .widget-container {
            width: 100%;
            height: 100%;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }
        /* TradingView widgets - remove their default copyright margin/padding */
        .tradingview-widget-copyright {
            padding: 4px 0;
            text-align: center;
            font-size: 12px;
            color: #8b949e;
        }
        .tradingview-widget-copyright a {
            color: #0366d6;
            text-decoration: none;
        }
        /* Ensure iframe-based widgets fill container */
        tv-ticker-tape, tv-economic-map {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <!-- TradingView Widget BEGIN -->
<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
  <div class="tradingview-widget-copyright">
    <a href="https://www.tradingview.com/news/top-providers/tradingview/" rel="noopener nofollow" target="_blank">
      <span class="blue-text">Top stories</span>
    </a>
    <span class="trademark"> by TradingView</span>
  </div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
  {
  "displayMode": "regular",
  "feedMode": "all_symbols",
  "colorTheme": "dark",
  "isTransparent": false,
  "locale": "en",
  "width": "100%",
  "height": 550
}
  </script>
</div>
<!-- TradingView Widget END -->
    </div>
</body>
</html>
