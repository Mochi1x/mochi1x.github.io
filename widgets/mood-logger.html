<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Logger Widget</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #fafafa;
            min-height: 100vh;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #0366d6;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .widget-container {
            background: white;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        p.description { color: #666; margin-bottom: 30px; }
        footer {
            text-align: center;
            color: #888;
            margin-top: 50px;
            font-size: 0.9em;
            padding-top: 20px;
            border-top: 1px solid #eaecef;
        }
        a { color: #0366d6; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Back to all widgets</a>
    <div class="widget-container">
        <h1>😊 Mood Logger</h1>
        <p class='description'>Your custom widget content below.</p>
        <div id="widget">
            <div style="text-align: center;">
     <p>How are you feeling today?</p>
     <div style="display: flex; gap: 10px; justify-content: center; margin: 20px 0; flex-wrap: wrap;">
         <button onclick="selectMood('😄 Great')" style="font-size: 2em; padding: 10px; cursor: pointer; background: none; border: 2px solid transparent;">😄</button>
         <button onclick="selectMood('🙂 Good')" style="font-size: 2em; padding: 10px; cursor: pointer; background: none; border: 2px solid transparent;">🙂</button>
         <button onclick="selectMood('😐 Okay')" style="font-size: 2em; padding: 10px; cursor: pointer; background: none; border: 2px solid transparent;">😐</button>
         <button onclick="selectMood('😔 Low')" style="font-size: 2em; padding: 10px; cursor: pointer; background: none; border: 2px solid transparent;">😔</button>
     </div>
     <p id="selected-mood" style="margin-top: 10px; font-weight: bold; color: #0366d6;"></p>
 </div>
 <script>
 function selectMood(mood) {
     document.getElementById('selected-mood').innerHTML = 'Selected: ' + mood;
 }
 </script>
        </div>
    </div>
    <footer>
        <a href="https://github.com/YOUR_USERNAME/YOUR_REPO" target="_blank">View source</a>
    </footer>
</body>
</html>
