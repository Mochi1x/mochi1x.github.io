<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Hours Widget</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: #0d1117;
            min-height: 100vh;
        }
        a { color: #0366d6; }
        .container { max-width: 1200px; margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #8b949e; }
        .widget-wrapper {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
        }
        .description {
            color: #8b949e;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        footer {
            text-align: center;
            color: #8b949e;
            margin-top: 30px;
            font-size: 0.85em;
        }
        .widget-frame {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        iframe {
            width: 100% !important;
            height: 420px !important;
            border: none !important;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to all widgets</a>
        
        <div class="widget-wrapper">
            <h1 style="color: #f0f6fc; margin-bottom: 10px;">🕐 Market Hours</h1>
            <p class="description">
                Forex market hours tracker. Shows which trading sessions are currently open 
                (Asia, Europe, North America) and upcoming market openings/closings.
            </p>
            
            <div class="widget-frame">
                <iframe src="https://xauusdjulia.com/forex-market-hours/widget" width="100%" height="420" style="border:none;border-radius:16px;" title="Forex Market Hours"></iframe>
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/">← All widgets</a>
        </div>

        <footer>
            <p>Widget source: <a href="https://xauusdjulia.com" target="_blank">xauusdjulia.com</a></p>
        </footer>
    </div>
</body>
</html>
