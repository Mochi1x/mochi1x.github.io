<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Heatmap Widget</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: #0d1117;
            min-height: 100vh;
        }
        a { color: #0366d6; }
        .container { max-width: 1200px; margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #8b949e; }
        .widget-wrapper {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
        }
        .description {
            color: #8b949e;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        footer {
            text-align: center;
            color: #8b949e;
            margin-top: 30px;
            font-size: 0.85em;
        }
        /* Ensure heatmap fills container */
        .tradingview-widget-container {
            height: 600px;
        }
        .tradingview-widget-container__widget {
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to all widgets</a>
        
        <div class="widget-wrapper">
            <h1 style="color: #f0f6fc; margin-bottom: 10px;">🗺️ Stock Heatmap</h1>
            <p class="description">
                Interactive stock market heatmap showing S&P 500 stocks grouped by sector.
                Color indicates price change, size reflects market cap.
            </p>
            
            <!-- TradingView Stock Heatmap Widget BEGIN -->
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <div class="tradingview-widget-copyright">
                    <a href="https://www.tradingview.com/heatmap/stock/" rel="noopener nofollow" target="_blank">
                        <span class="blue-text">Stock Heatmap</span>
                    </a>
                    <span class="trademark"> by TradingView</span>
                </div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
                {
                "dataSource": "SPX500",
                "blockSize": "market_cap_basic",
                "blockColor": "change",
                "grouping": "sector",
                "locale": "en",
                "symbolUrl": "",
                "colorTheme": "dark",
                "exchanges": [],
                "hasTopBar": false,
                "isDataSetEnabled": false,
                "isZoomEnabled": true,
                "hasSymbolTooltip": true,
                "isMonoSize": false,
                "width": "100%",
                "height": "100%"
                }
                </script>
            </div>
            <!-- TradingView Stock Heatmap Widget END -->
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/">← All widgets</a>
        </div>

        <footer>
            <p>Widget powered by <a href="https://tradingview.com" target="_blank">TradingView</a></p>
        </footer>
    </div>
</body>
</html>
