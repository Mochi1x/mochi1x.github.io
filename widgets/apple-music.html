<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple Music — 13th Reason</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: rgba(24,24,27,0.6);
      --card-border: rgba(63,63,70,0.5);
      --text-main: #e4e4e7;
      --text-muted: #71717a;
      --accent: #f59e0b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: var(--bg);
      color: var(--text-main);
      font-family: "Inter", -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .wrap {
      max-width: 900px; margin: 0 auto;
      padding: 40px 20px 60px;
    }
    .header {
      text-align: center; margin-bottom: 24px;
    }
    .header h1 {
      font-size: 24px; font-weight: 700; color: var(--text-main);
      margin-bottom: 4px;
    }
    .header p {
      color: var(--text-muted); font-size: 14px; opacity: 0.8;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      overflow: hidden;
      backdrop-filter: blur(12px) saturate(180%);
      box-shadow: 0 4px 24px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: scale(1.01);
      box-shadow: 0 8px 32px rgba(245,158,11,0.15), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .iframe-wrap {
      width: 100%;
      height: 0;
      padding-bottom: 22.7%; /* 150/660 ≈ 0.227 — maintain aspect ratio */
      position: relative;
      background: transparent;
    }
    .iframe-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100% !important;
      height: 100% !important;
      border: 0;
    }
    .footer {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>Apple Music</h1>
      <p>13th Reason — Album by Nino Paid</p>
    </div>

    <div class="card">
      <div class="iframe-wrap">
        <iframe
          allow="autoplay *; encrypted-media *; fullscreen"
          frameborder="0"
          height="150"
          sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation"
          src="https://embed.music.apple.com/us/album/13th-reason/1873421961?i=1873421963"
        ></iframe>
      </div>
    </div>

    <p class="footer">
      Powered by <a href="https://music.apple.com" target="_blank" rel="noopener">Apple Music</a>
    </p>
  </div>
</body>
</html>
