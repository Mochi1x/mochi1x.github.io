<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator Widget</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #fafafa;
            min-height: 100vh;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #0366d6;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .widget-container {
            background: white;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        p.description { color: #666; margin-bottom: 30px; }
        footer {
            text-align: center;
            color: #888;
            margin-top: 50px;
            font-size: 0.9em;
            padding-top: 20px;
            border-top: 1px solid #eaecef;
        }
        a { color: #0366d6; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Back to all widgets</a>
    <div class="widget-container">
        <h1>✨ Daily Quote Generator</h1>
        <p class='description'>Your custom widget content below.</p>
        <div id="widget">
            <div style="text-align: center; padding: 40px;">
     <button onclick="document.getElementById('quote').innerHTML = quotes[Math.floor(Math.random() * quotes.length)]" 
             style="padding: 12px 24px; font-size: 16px; cursor: pointer; background: #0366d6; color: white; border: none; border-radius: 6px;">
         Generate Quote
     </button>
     <p id="quote" style="margin-top: 20px; font-size: 1.2em; font-style: italic; color: #555;"></p>
 </div>
 <script>
 const quotes = [
     "The only way to do great work is to love what you do. — Steve Jobs",
     "Innovation distinguishes between a leader and a follower. — Steve Jobs",
     "Your time is limited, so don't waste it living someone else's life. — Steve Jobs"
 ];
 </script>
        </div>
    </div>
    <footer>
        <a href="https://github.com/YOUR_USERNAME/YOUR_REPO" target="_blank">View source</a>
    </footer>
</body>
</html>
