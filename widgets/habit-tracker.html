<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker Widget</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            background: #fafafa;
            min-height: 100vh;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #0366d6;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .widget-container {
            background: white;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        h1 { color: #2c3e50; margin-bottom: 20px; }
        p.description { color: #666; margin-bottom: 30px; }
        footer {
            text-align: center;
            color: #888;
            margin-top: 50px;
            font-size: 0.9em;
            padding-top: 20px;
            border-top: 1px solid #eaecef;
        }
        a { color: #0366d6; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <a href="/" class="back-link">← Back to all widgets</a>
    <div class="widget-container">
        <h1>✓ Habit Tracker</h1>
        <p class='description'>Your custom widget content below.</p>
        <div id="widget">
            <div id="habit-tracker">
     <style>
         .habit { display: flex; align-items: center; margin: 10px 0; padding: 10px; background: #f6f8fa; border-radius: 6px; }
         .habit-name { flex: 1; }
         .habit-check { width: 24px; height: 24px; cursor: pointer; }
     </style>
     <div class="habit">
         <span class="habit-name">Drink water</span>
         <input type="checkbox" class="habit-check">
     </div>
     <div class="habit">
         <span class="habit-name">Exercise</span>
         <input type="checkbox" class="habit-check">
     </div>
     <div class="habit">
         <span class="habit-name">Read</span>
         <input type="checkbox" class="habit-check">
     </div>
 </div>
        </div>
    </div>
    <footer>
        <a href="https://github.com/YOUR_USERNAME/YOUR_REPO" target="_blank">View source</a>
    </footer>
</body>
</html>
