<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News / Top Stories Widget</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            background: #0d1117;
            min-height: 100vh;
        }
        a { color: #0366d6; }
        .container { max-width: 800px; margin: 0 auto; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #8b949e; }
        .widget-wrapper {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
        }
        .description {
            color: #8b949e;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        footer {
            text-align: center;
            color: #8b949e;
            margin-top: 30px;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to all widgets</a>
        
        <div class="widget-wrapper">
            <h1 style="color: #f0f6fc; margin-bottom: 10px;">📰 News / Top Stories</h1>
            <p class="description">
                Financial news and top stories from TradingView. 
                Embed this widget in your Notion journal to stay updated with market news.
            </p>
            
            <!-- TradingView Widget BEGIN -->
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <div class="tradingview-widget-copyright">
                    <a href="https://www.tradingview.com/news/top-providers/tradingview/" rel="noopener nofollow" target="_blank">
                        <span class="blue-text">Top stories</span>
                    </a>
                    <span class="trademark"> by TradingView</span>
                </div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-timeline.js" async>
                {
                "displayMode": "regular",
                "feedMode": "all_symbols",
                "colorTheme": "dark",
                "isTransparent": false,
                "locale": "en",
                "width": "100%",
                "height": 550
                }
                </script>
            </div>
            <!-- TradingView Widget END -->
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/">← All widgets</a>
        </div>

        <footer>
            <p>Widget powered by <a href="https://tradingview.com" target="_blank">TradingView</a></p>
        </footer>
    </div>
</body>
</html>
